appId: com.antishare.app
productName: AntiShare
copyright: Copyright © AntiShare
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - resources/drag-icon.png
asar: true
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dir
    - dmg
  artifactName: AntiShare-${version}-mac-${arch}.${ext}
  extendInfo:
    NSLocalNetworkUsageDescription: AntiShare descubre otros equipos en tu red local (Wi‑Fi o Ethernet) y comparte carpetas en la LAN. Sin este permiso, los peers no pueden verte ni abrir tu share.
    NSBonjourServices:
      - _antishare._udp.
      - _http._tcp.
extraResources:
  - from: resources/drag-icon.png
    to: drag-icon.png
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AntiShare-${version}-win-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AntiShare
  uninstallDisplayName: AntiShare
  artifactName: AntiShare-${version}-win-${arch}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: AntiShare-${version}-win-${arch}-portable.${ext}
npmRebuild: false

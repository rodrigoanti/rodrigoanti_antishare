appId: com.antishare.app
productName: AntiShare
copyright: Copyright © AntiShare
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  - resources/drag-icon.png
asar: true
extraResources:
  - from: resources/drag-icon.png
    to: drag-icon.png
  - from: build/icon.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AntiShare-${version}-win-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AntiShare
  uninstallDisplayName: AntiShare
  artifactName: AntiShare-${version}-win-${arch}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: AntiShare-${version}-win-${arch}-portable.${ext}
npmRebuild: false
